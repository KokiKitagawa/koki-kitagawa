<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1120">
<title>北川弘喜 | ギタリスト・作曲家</title>
<meta name="description" content="書けるギタリスト、弾ける作曲家。北川弘喜（Koki Kitagawa）への作曲・編曲・ギター演奏のご依頼と、ギターレッスンのお申し込み。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1120; --bg2:#0e182b; --panel:#131f36; --panel2:#18263f; --line:#2a3a5c;
  --ink:#f3f6fb; --sub:#c3cde0; --faint:#93a1bb;
  --or:#e2560e; --or-top:#f06a1d; --or-hi:#ff9440; --or-soft:rgba(255,140,60,.15);
  --gr:#15803d; --gr-top:#1d9b52; --gr-hi:#4ade80; --gr-soft:rgba(74,222,128,.12);
  --lesson:#1b2a48;
  --en:"Oswald","Arial Narrow",sans-serif;
  --sig:"Mrs Saint Delafield","Brush Script MT",cursive;
  --dock:76px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#050a14;color:var(--ink);
  font:16px/1.75 "Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;letter-spacing:.02em}
a{color:inherit}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--or-hi);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;background:var(--bg);min-height:100svh;
  padding-bottom:calc(var(--dock) + env(safe-area-inset-bottom));position:relative;overflow-x:clip}
@media (min-width:600px){.wrap{box-shadow:0 0 0 1px #16223a,0 30px 80px rgba(0,0,0,.6)}}

/* ---------- ヘッダー ---------- */
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(10,17,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(42,58,92,.6)}
.logo{text-decoration:none;display:flex;flex-direction:column;line-height:1}
.logo .sig{font-family:var(--sig);font-size:30px;line-height:.9;color:#fff}
.logo small{font-family:var(--en);font-size:10.5px;letter-spacing:.18em;color:var(--faint);margin-top:2px}
.menu-btn{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.menu-btn span{display:block;width:24px;height:2px;background:#fff;box-shadow:0 7px 0 #fff,0 -7px 0 #fff}

/* ---------- ヒーロー ---------- */
.hero{position:relative;height:clamp(320px,43svh,410px);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,17,32,0) 38%,rgba(10,17,32,.86) 74%,var(--bg) 100%)}
.hero .copy{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.hero .kicker{font-family:var(--en);font-size:12.5px;letter-spacing:.22em;color:var(--or-hi);margin:0}
.hero h1{margin:4px 0 2px;font-size:27px;line-height:1.35;font-weight:900;letter-spacing:.04em}
.hero .name{font-family:var(--en);font-size:15px;letter-spacing:.2em;color:var(--sub);margin:0}
.hero .sig{position:absolute;right:12px;top:14px;z-index:1;font-family:var(--sig);font-size:34px;color:rgba(255,255,255,.85);transform:rotate(-8deg)}

/* ---------- 写真の演出（北川さんの案の手書き文字と、ステージの光） ---------- */
.fx{position:relative}
.fx::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(55% 38% at 88% 6%,rgba(255,160,80,.30),transparent 70%),
             radial-gradient(45% 32% at 6% 0%,rgba(150,120,255,.30),transparent 70%)}
.script{position:absolute;z-index:2;font-family:var(--sig);line-height:.95;color:rgba(255,255,255,.92);
  text-shadow:0 2px 12px rgba(0,0,0,.55);pointer-events:none;white-space:nowrap}
.script.or{color:var(--or-hi)}
.photo{position:relative}
.photo .script{right:14px;bottom:10px;font-size:40px;transform:rotate(-8deg)}

/* ---------- 節の見出し（数字は残す） ---------- */
.sec{padding:28px 16px}
.label{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.label .no{font-family:var(--en);font-size:22px;color:var(--or-hi);font-weight:600}
.label .en{font-family:var(--en);font-size:13px;letter-spacing:.2em;color:var(--sub)}
.h2{margin:0 0 6px;font-size:24px;line-height:1.4;font-weight:900}
.lede{margin:0 0 16px;color:var(--sub)}
.guide{margin:0 0 12px;color:var(--faint);font-size:14px}

/* ---------- フォーム（いちばん上の主役） ---------- */
.formcard{margin:0 12px;padding:16px 14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;scroll-margin-top:64px}
.formcard h2{margin:0;font-size:20px;font-weight:900;line-height:1.4}
.formcard .sample{display:inline-block;margin:0 0 6px;padding:1px 8px;border:1px solid var(--faint);border-radius:99px;font-size:12px;color:var(--faint)}
.steps{display:flex;gap:6px;margin:10px 0 12px;font-size:12.5px;color:var(--faint)}
.steps li{list-style:none;flex:1;text-align:center;padding:4px 0;border-bottom:3px solid var(--line)}
.steps li.on{color:var(--ink);border-color:var(--or-hi);font-weight:700}
.steps{padding:0}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{min-height:84px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);text-align:left;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .15s,border-color .15s}
.type b{font-size:17px;line-height:1.35}
.type .ico{width:26px;height:26px;margin-bottom:2px}
.type.l .ico{color:var(--or-hi)} .type.w .ico{color:var(--gr-hi)} .type.o .ico{color:var(--sub)}
.type small{font-size:12.5px;color:var(--sub);line-height:1.4}
.type.l{border-color:rgba(255,138,76,.55);background:var(--or-soft)}
.type.w{border-color:rgba(74,222,128,.45);background:var(--gr-soft)}
.type[aria-pressed="true"]{transform:translateY(-1px);box-shadow:0 0 0 3px rgba(255,255,255,.18) inset}
.type.l[aria-pressed="true"]{border-color:var(--or-hi);box-shadow:0 0 22px rgba(255,140,60,.35)} .type.w[aria-pressed="true"]{border-color:var(--gr-hi);box-shadow:0 0 22px rgba(74,222,128,.28)}
.type .mark{display:none}
.type.l .mark{color:var(--or-hi)} .type.w .mark{color:var(--gr-hi)} .type.o .mark{color:var(--faint)}

.fields{margin-top:16px;display:grid;gap:14px}
.field label,.field legend{display:block;font-size:14.5px;font-weight:700;margin-bottom:6px;padding:0}
.req{font-size:11.5px;color:#ffb38a;margin-left:6px;font-weight:500}
.opt{font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:50px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:#0b1424;color:var(--ink);font-size:16px}
.field textarea{min-height:110px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#7d8aa4}
.field fieldset{border:0;margin:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;font-weight:500;font-size:14.5px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;background:#0b1424;cursor:pointer}
.chips input:checked+span{border-color:var(--or-hi);background:var(--or-soft);font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--or-hi);outline-offset:2px}
.note{font-size:13.5px;color:var(--sub);background:var(--bg2);border-left:3px solid var(--or-hi);padding:8px 10px;border-radius:6px;margin:0}
.err{color:#ffb38a;font-size:13.5px;margin:4px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- ボタン ---------- */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 20px;border-radius:999px;border:0;
  font-weight:800;font-size:18.7px;letter-spacing:.06em;text-decoration:none;cursor:pointer;white-space:nowrap;width:100%;
  transition:transform .15s,box-shadow .2s,filter .2s}
.btn .ico{width:22px;height:22px;flex:none}
.btn .arr{width:18px;height:18px;flex:none;margin-left:2px;transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.btn:active{transform:translateY(1px)}
.btn.or{background:linear-gradient(180deg,var(--or-top),var(--or));color:#fff;text-shadow:0 1px 0 rgba(110,30,0,.5);
  box-shadow:inset 0 1px 0 rgba(255,210,170,.55),inset 0 0 0 1px rgba(255,170,110,.35),0 8px 22px rgba(240,96,20,.38),0 0 26px rgba(255,140,60,.22)}
.btn.gr{background:linear-gradient(180deg,var(--gr-top),var(--gr));color:#fff;text-shadow:0 1px 0 rgba(0,50,20,.5);
  box-shadow:inset 0 1px 0 rgba(170,255,200,.45),inset 0 0 0 1px rgba(90,220,140,.3),0 8px 22px rgba(21,128,61,.38),0 0 26px rgba(74,222,128,.18)}
.btn.or:hover,.btn.gr:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1.5px solid var(--sub);color:var(--ink);font-weight:500;font-size:15.5px;min-height:48px}
.btn svg{width:20px;height:20px;flex:none}
.btns{display:grid;gap:10px;margin-top:16px}

/* ---------- 数 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding:0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.stats dt{font-size:11.5px;color:var(--sub);line-height:1.4}
.stats dd{margin:0;font-family:var(--en);font-size:26px;line-height:1.2}
.stats dd small{font-family:"Noto Sans JP",sans-serif;font-size:11px;color:var(--sub)}
.proof{margin:10px 0 0;font-size:13.5px;color:var(--sub)}

/* ---------- 代表作（よこにスライド） ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:72%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none;scroll-padding-inline:16px}
.rail::-webkit-scrollbar{display:none}
.song{scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.song .art{position:relative;aspect-ratio:1;background:#1a2540 center/cover no-repeat;display:block;width:100%;border:0;padding:0;cursor:pointer}
.song .art .play{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:#1DB954;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.song .art .play::before{content:"";border-left:14px solid #0a1120;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.song .art .fallback{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--en);font-size:22px;letter-spacing:.1em;color:var(--sub)}
.song .meta{padding:10px 12px 12px}
.song .meta b{display:block;font-size:16px}
.song .meta span{font-size:13px;color:var(--sub)}
.song iframe{display:block;width:100%;height:352px;border:0}
.railnav{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.railnav button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px}

/* ---------- 部屋への入口 ---------- */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:168px;padding:12px;border-radius:14px;background:var(--panel) center/cover no-repeat;
  border:1px solid var(--line);text-decoration:none;overflow:hidden;isolation:isolate}
.room::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,17,32,.05) 15%,rgba(10,17,32,.78) 55%,rgba(10,17,32,.96) 100%)}
.room:hover{border-color:var(--or-hi)}
.room .no{font-family:var(--en);color:var(--or-hi);font-size:20px;line-height:1}
.room .en{font-family:var(--en);font-size:12px;letter-spacing:.18em;color:var(--sub)}
.room b{font-size:17px;line-height:1.35;margin-top:2px}
.room small{font-size:12.5px;color:var(--sub);line-height:1.45}

/* ---------- 部屋（下層） ---------- */
.roomtop{padding:12px 16px 0}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--sub);text-decoration:none}
.roomhead{padding:6px 16px 0}
.roomhead .no{font-family:var(--en);font-size:40px;color:var(--or-hi);line-height:1}
.roomhead .en{font-family:var(--en);font-size:15px;letter-spacing:.24em;color:var(--sub);margin-left:8px}
.roomhead h1{margin:6px 0 4px;font-size:30px;line-height:1.3;font-weight:900}
.roomhead p{margin:0;color:var(--sub)}
.photo{margin:14px 16px 0;border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:#14203a}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.wide{aspect-ratio:16/10}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{border:1.5px solid var(--or-hi);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14.5px}
.plans{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.plan{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.plan b{font-size:16.5px}
.plan small{display:block;color:var(--sub);font-size:13px}
.plan .price{font-family:var(--en);font-size:22px;white-space:nowrap;text-align:right}
.plan .price small{font-family:"Noto Sans JP";display:inline;font-size:12px}
.plan.rec{border:2px solid var(--or-hi);background:var(--or-soft)}
.badge{display:inline-block;background:var(--or-hi);color:#1a0d04;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.plan.first{border-style:dashed}
table.hours{width:100%;border-collapse:collapse;font-size:14.5px}
.hours th,.hours td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:top}
.hours th{width:30%;font-weight:700}
.hours td small{display:block;color:var(--sub);font-size:12.5px}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
dl.facts dt{color:var(--sub)} dl.facts dd{margin:0}

details.shelf{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.shelf summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px;min-height:60px}
details.shelf summary::-webkit-details-marker{display:none}
details.shelf summary .no{font-family:var(--en);color:var(--or-hi);font-size:20px}
details.shelf summary b{flex:1;font-size:16.5px;line-height:1.4}
details.shelf summary .cnt{font-size:13px;color:var(--sub);white-space:nowrap}
details.shelf summary::after{content:"＋";font-size:18px;color:var(--sub);margin-left:4px}
details.shelf[open] summary::after{content:"－"}
.list{margin:0;padding:0 14px 12px;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.list li span{color:var(--sub);font-size:13px;white-space:nowrap}
.list li i{font-style:normal;font-size:12px;color:var(--or-hi);margin-left:6px}
.timeline{margin:0;padding:0;list-style:none}
.timeline>li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.timeline .y{font-family:var(--en);font-size:20px;color:var(--or-hi);line-height:1.3}
.timeline ul{margin:0;padding:0;list-style:none}
.timeline ul li{font-size:15px;line-height:1.6;padding:2px 0}
.timeline ul li small{color:var(--sub);font-size:12.5px}
.bio p{margin:0 0 12px;color:var(--sub)}
.bio p:first-child{color:var(--ink);font-weight:700}

/* レッスンの部屋は、同じ世界観のまま明度だけ上げる */
.lesson-room{background:var(--lesson)}
.lesson-room .plan,.lesson-room details.shelf{background:#22345a}

/* ---------- SNS（各サービスの色） ---------- */
.sns{display:flex;gap:12px;flex-wrap:wrap}
.sns a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.sns svg{width:24px;height:24px;fill:#fff}
.sns .ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.sns .x{background:#000;border:1px solid #3b4a68}
.sns .yt{background:#FF0000}
.sns .sp{background:#1DB954}
.sns .sp svg{fill:#000}
.listen{display:grid;gap:10px}
.listen a{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none}
.listen a i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.listen a i svg{width:22px;height:22px;fill:#fff}
.listen a b{display:block;font-size:16px} .listen a small{display:block;font-size:13px;color:var(--sub)}

footer{padding:24px 16px 20px;border-top:1px solid var(--line);margin-top:8px}
footer .sig{font-family:var(--sig);font-size:34px}
footer p{margin:8px 0 0;font-size:12.5px;color:var(--faint)}

/* ---------- 下の固定帯：2つのボタン ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:100%;max-width:480px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,17,32,0),rgba(10,17,32,.96) 30%)}
.dock .btn{min-height:56px;padding:0 8px;gap:8px}
.dock.hide{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.dock{transition:opacity .2s,transform .2s}

/* ---------- メニュー ---------- */
.menu{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.7);display:flex;justify-content:center}
.menu .panel{width:100%;max-width:480px;background:var(--bg);padding:12px 16px 24px;overflow:auto}
.menu .head{display:flex;justify-content:space-between;align-items:center;height:48px}
.menu .close{width:48px;height:48px;border:0;background:none;font-size:28px;cursor:pointer}
.menu nav a{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--line);text-decoration:none;font-size:17px}
.menu nav a span{font-family:var(--en);color:var(--or-hi);margin-right:10px}

.done{text-align:center;padding:10px 0}
.done b{display:block;font-size:20px;margin-bottom:6px}
.confirm dl{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:6px 10px;font-size:14.5px}
.confirm dt{color:var(--sub)} .confirm dd{margin:0;word-break:break-word}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">

<header class="top">
  <a class="logo" href="#top" aria-label="北川弘喜 トップへ"><span class="sig">Koki Kitagawa</span><small>GUITARIST / COMPOSER</small></a>
  <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu" id="menuBtn"><span></span></button>
</header>

<main id="view"></main>

<footer>
  <div class="sig">Koki Kitagawa</div>
  <div class="sns" style="margin-top:12px" id="footSns"></div>
  <p>© 2026 Koki Kitagawa</p>
</footer>

<div class="dock" id="dock">
  <button class="btn or" type="button" data-open="lesson" data-short>レッスン予約</button>
  <button class="btn gr" type="button" data-open="compose" data-short>仕事の依頼</button>
</div>

<div class="menu" id="menu" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="メニュー">

    {n:"ref", t:"url", l:"参考音源のURL", ph:"https://"},
    {n:"msg", t:"textarea", l:"内容", req:1, ph:"例）2曲・ディストーション中心・音源は別途お送りします"},
  ],
  other: [
    {n:"subject", t:"text", l:"件名", req:1},
    {n:"msg", t:"textarea", l:"内容", req:1},
  ],
};
const COMMON = [
  {n:"name", t:"text", l:"お名前", req:1, ph:"山田 太郎", ac:"name"},
  {n:"email", t:"email", l:"メールアドレス", req:1, ph:"example@mail.com", ac:"email"},
];

let state = {type:null, step:1, values:{}};

function formHTML(){
  return `<section class="formcard" id="form" aria-labelledby="formTitle">
    <span class="sample">見本：まだ送信はされません</span>
    <h2 id="formTitle">ご依頼・お問い合わせ</h2>
    <ol class="steps" aria-label="手順"><li class="on" data-s="1">1 ご用件</li><li data-s="2">2 内容</li><li data-s="3">3 確認</li></ol>
    <div id="formBody"></div>
  </section>`;
}
function renderForm(){
  const box = $("#formBody"); if(!box) return;
  document.querySelectorAll(".steps li").forEach(li => li.classList.toggle("on", +li.dataset.s === state.step));
  if(state.step === 3){ box.innerHTML = confirmHTML(); decorate(box); bindConfirm(); return; }
  if(state.step === 4){ box.innerHTML = doneHTML(); return; }
  const TI = {lesson:"cal", compose:"note", guitar:"pick", other:"chat"};
  const types = Object.entries(TYPES).map(([k,t]) =>
    `<button type="button" class="type ${t.cls}" data-type="${k}" aria-pressed="${state.type===k}">${ic(TI[k])}<b>${t.name}</b><small>${t.sub}</small></button>`).join("");
  let html = `<p class="guide" style="margin:0 0 10px">${state.type ? "内容を書いて「確認へ」を押してください。" : "まず、ご用件を選んでください。押すと、その下に入力欄が開きます。"}</p>
    <div class="types" role="group" aria-label="ご用件">${types}</div>`;
  if(state.type){
    const fs = [...FIELDS[state.type], ...COMMON];
    html += `<form class="fields" id="theForm" novalidate>${fs.map(fieldHTML).join("")}
      <div class="btns"><button class="btn ${state.type==="lesson"?"or":"gr"}" type="submit">確認へ進む</button></div></form>`;
  }
  box.innerHTML = html; decorate(box);
  box.querySelectorAll(".type").forEach(b => b.addEventListener("click", () => { state.type = b.dataset.type; state.step = 2; renderForm(); $("#theForm input, #theForm select, #theForm textarea")?.focus({preventScroll:true}); }));
  const f = $("#theForm");
  if(f) f.addEventListener("submit", e => { e.preventDefault(); if(collect(f)){ state.step = 3; renderForm(); $("#form").scrollIntoView({block:"start"}); } });
}
function fieldHTML(x){
  const v = state.values[x.n] ?? "";
  const lab = `${esc(x.l)}${x.req ? '<span class="req">必須</span>' : '<span class="opt">任意</span>'}`;
  if(x.t === "note") return `<p class="note">${esc(x.l)}</p>`;
  if(x.t === "chips"){
    const type = x.multi ? "checkbox" : "radio";
    const cur = [].concat(v || []);
    return `<div class="field"><fieldset><legend>${lab}</legend><div class="chips">${x.o.map(o =>
      `<label><input type="${type}" name="${x.n}" value="${esc(o)}" ${cur.includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></fieldset><p class="err" hidden></p></div>`;
  }
  if(x.t === "select") return `<div class="field"><label for="f_${x.n}">${lab}</label><select id="f_${x.n}" name="${x.n}"><option value="">選んでください</option>${x.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select><p class="err" hidden></p></div>`;
  if(x.t === "textarea") return `<div class="field"><label for="f_${x.n}">${lab}</label><textarea id="f_${x.n}" name="${x.n}" placeholder="${esc(x.ph||"")}">${esc(v)}</textarea><p class="err" hidden></p></div>`;
  return `<div class="field"><label for="f_${x.n}">${lab}</label><input id="f_${x.n}" name="${x.n}" type="${x.t}" value="${esc(v)}" placeholder="${esc(x.ph||"")}" ${x.ac?`autocomplete="${x.ac}"`:""} ${x.t==="email"?'inputmode="email"':""}><p class="err" hidden></p></div>`;
}
function collect(f){
  const fs = [...FIELDS[state.type], ...COMMON].filter(x => x.t !== "note");
  let ok = true, first = null;
  for(const x of fs){
    let val;
    if(x.t === "chips") val = [...f.querySelectorAll(`input[name="${x.n}"]:checked`)].map(i => i.value);
    else val = (f.elements[x.n]?.value || "").trim();
    state.values[x.n] = val;
    const empty = Array.isArray(val) ? !val.length : !val;
    let msg = "";
    if(x.req && empty) msg = "ここを入れてください。";
    else if(x.t === "email" && val && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) msg = "メールアドレスの形を確かめてください。";
    const box = (f.elements[x.n]?.closest?.(".field")) || f.querySelector(`input[name="${x.n}"]`)?.closest(".field");
    const er = box?.querySelector(".err");
    if(er){ er.textContent = msg; er.hidden = !msg; }
    if(msg){ ok = false; first ||= box; }
  }
  if(first) first.scrollIntoView({block:"center"});
  return ok;
}
function confirmHTML(){
  const fs = [...FIELDS[state.type], ...COMMON].filter(x => x.t !== "note");
  const nice = (x,v) => {
    if(x.t === "datetime-local" && v){ const d = new Date(v); return `${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
    if(x.t === "date" && v){ const d = new Date(v+"T00:00"); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
    return Array.isArray(v) ? v.join("、") : v; };
  const rows = fs.map(x => { const s = nice(x, state.values[x.n]); return s ? `<dt>${esc(x.l)}</dt><dd>${esc(s)}</dd>` : ""; }).join("");
  const src = FROM_NAMES[from] ? `<dt>どこで知ったか</dt><dd>${FROM_NAMES[from]}（自動）</dd>` : "";
  return `<div class="confirm"><p class="guide" style="margin:0 0 10px">この内容で送ります。直すときは「戻る」を押してください。</p>
    <dl><dt>ご用件</dt><dd>${TYPES[state.type].name}</dd>${rows}${src}</dl>
    <div class="btns"><button class="btn ${state.type==="lesson"?"or":"gr"}" type="button" id="send">この内容で送る</button><button class="btn ghost" type="button" id="back">戻る</button></div></div>`;
}
function bindConfirm(){
  $("#back").onclick = () => { state.step = 2; renderForm(); };
  $("#send").onclick = () => { state.step = 4; renderForm(); $("#form").scrollIntoView({block:"start"}); };
}
function doneHTML(){
  return `<div class="done"><b>ありがとうございます</b><p class="lede">2日以内に、メールでご返信します。<br><small>（いまは見本なので、実際には送信されていません）</small></p>
    <button class="btn ghost" type="button" onclick="state={type:null,step:1,values:{}};renderForm()">はじめに戻る</button></div>`;
}
function openForm(type){
  if(location.hash && location.hash !== "#top"){ history.pushState(null,"",location.pathname+location.search); render(); }
  closeMenu();
  state.type = type; state.step = 2; renderForm();
  requestAnimationFrame(() => $("#form").scrollIntoView({block:"start"}));
}

const VIEWS = {works, live, lesson, profile};

function render(){
  const id = location.hash.slice(1);

  $("#view").innerHTML = v ? v() : home();
  if(!v){ renderForm(); }
  document.title = v ? `${ROOMS.find(r=>r.id===id).jp} | 北川弘喜` : "北川弘喜 | ギタリスト・作曲家";
  if(v) window.scrollTo(0,0);
  bindView(); watchForm(); decorate();
}
function bindView(){
  /* 再生は常に1つだけ（前のプレイヤーは外す） */
  document.querySelectorAll(".art[data-track]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.track; if(!id) return;
    document.querySelectorAll(".song iframe").forEach(f => { f.replaceWith(f._orig); });
    const f = document.createElement("iframe");
    f.src = `https://open.spotify.com/embed/track/${id}?utm_source=generator&theme=0`;
    f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture"; f.loading = "lazy"; f.title = b.getAttribute("aria-label");
    f._orig = b; b.replaceWith(f);
  }));
}
let io;
function watchForm(){
  const dock = $("#dock"), form = $("#form");
  io?.disconnect();
  if(!form){ dock.classList.remove("hide"); return; }
  io = new IntersectionObserver(es => es.forEach(e => dock.classList.toggle("hide", e.isIntersecting)), {threshold:.15});
  io.observe(form);
}
